# Local infrastructure for the boilerplate.
#
#   docker compose -f docker-compose.dev.yml up -d postgres redis rustfs
#
# The API and the worker run on the host (`make dev`, `make worker`) and talk to
# these services through 127.0.0.1, which is what .env.example assumes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_strong_pass
      POSTGRES_DB: tests
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "redis_strong_pass"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_strong_pass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 compatible storage. Swap the image for `minio/minio` if you prefer.
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ROOT_USER: RUSTFSadmin
      RUSTFS_ROOT_PASSWORD: RUSTFS_strong_pass
    command: ["/data", "--address", "0.0.0.0:9000", "--console-address", "0.0.0.0:9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
