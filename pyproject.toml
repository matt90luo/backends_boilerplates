[project]
name = "tinysaas"
version = "0.1.0"
description = "Tiny SaaS backend boilerplate: auth, credits, service gateway, RBAC on DDD + composition root"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "arq>=0.26",
    "asyncpg>=0.30",
    "boto3>=1.35",
    "dependency-injector>=4.46",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pyjwt>=2.9",
    "pydantic-settings>=2.7",
    "redis>=5.0,<6",
    "sentry-sdk>=2.20",
    "sqlalchemy[asyncio]>=2.0",
    "stripe[async]>=16.0",
    "structlog>=24.4",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinysaas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires the local PostgreSQL, Redis and S3 (RustFS) services",
]
addopts = "-q -m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies in defaults; that is the documented idiom.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Path",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["alembic/versions"]
