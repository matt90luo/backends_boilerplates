<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>{{ app_name }}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f5f6f8;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#1f2430;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <h1 style="font-size:20px;margin:0 0 16px;">{{ app_name }}</h1>
                {% block content %}{% endblock %}
                <hr style="border:none;border-top:1px solid #eceef2;margin:24px 0;" />
                <p style="font-size:12px;color:#8a90a0;margin:0;">
                  这是一封由 {{ app_name }} 自动发送的邮件，请勿直接回复。
                  {% if support_email is defined and support_email %}如需帮助请联系 {{ support_email }}。{% endif %}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
