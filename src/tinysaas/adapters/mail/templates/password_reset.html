{% extends "layout.html" %}
{% block content %}
<p style="font-size:14px;line-height:22px;">{{ display_name }}，我们收到了重置密码的请求。</p>
<p style="font-size:14px;line-height:22px;">
  链接在 {{ expires_in_minutes }} 分钟内有效：<br />
  <a href="{{ reset_url }}" style="color:#2f6fed;">{{ reset_url }}</a>
</p>
<p style="font-size:13px;color:#8a90a0;">如果不是你发起的请求，请忽略这封邮件，你的密码不会被修改。</p>
{% endblock %}
